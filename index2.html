<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup page</title>
    <link rel="stylesheet" href="style2.css"/> 
  </head>
  <body>
    <div id="container">
      <form action="./action">
        <h2>Sign Up</h2>
        <input id="Fname" class="verify" type="text" placeholder="First Name"/>
        <input id="Lname" class="verify" type="text" placeholder="Last Name"/>
        <input id="Mail" class="verify" type="text" placeholder="Email"/>
        <input id="Pass" class="verify" type="password" placeholder="Password"/>
        <button id="click">SIGN UP</button>
      </form>
    </div>

    <script src="app.js"></script>
  </body>
</html>
