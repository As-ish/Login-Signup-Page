<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css"/> 
  </head>
  <body>
    <div id="container">
      <form action="./action">
        <h2>Login</h2>
        <input id="user" class="verify" type="text" placeholder="Username"/>
        <input id="pass" class="verify" type="password" placeholder="Password"/>
        <input type="Checkbox" id="check"/>
        <label id="one" for="check">Remember me</label>
        <span id="two">Forgot password?</span>
        <button id="click">LOGIN</button>
      </form>
    </div>

    <script src="app2.js"></script>
  </body>
</html>
